<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#062338"/>
      <stop offset="100%" stop-color="#010409"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eafcff"/>
      <stop offset="35%" stop-color="#6ff0ff"/>
      <stop offset="100%" stop-color="#0aa6cf"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g fill="none" stroke="#38e1ff" filter="url(#glow)">
    <circle cx="256" cy="256" r="176" stroke-width="3" opacity="0.35" stroke-dasharray="6 16"/>
    <circle cx="256" cy="256" r="150" stroke-width="5" opacity="0.8" stroke-dasharray="180 100"/>
    <circle cx="256" cy="256" r="122" stroke-width="3" opacity="0.55" stroke-dasharray="120 60"/>
    <circle cx="256" cy="256" r="92"  stroke-width="6" opacity="0.9"/>
  </g>

  <!-- tick marks -->
  <g stroke="#38e1ff" stroke-width="3" opacity="0.5">
    <line x1="256" y1="52"  x2="256" y2="74"/>
    <line x1="256" y1="438" x2="256" y2="460"/>
    <line x1="52"  y1="256" x2="74"  y2="256"/>
    <line x1="438" y1="256" x2="460" y2="256"/>
  </g>

  <circle cx="256" cy="256" r="60" fill="url(#core)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="30" fill="#ffffff" opacity="0.9"/>
</svg>
