<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Magic 8 Ball</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="bar">
    <h1>Magic 8&nbsp;Ball</h1>
    <div class="bar-actions">
      <button id="mute" class="icon-btn" type="button" aria-pressed="false" title="Mute sound">
        <svg class="ic ic-sound" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3.2 6.1h2.3L8.7 3.3v9.4L5.5 9.9H3.2z" fill="currentColor" />
          <path d="M10.9 5.9a3 3 0 0 1 0 4.2M12.9 4.2a5.6 5.6 0 0 1 0 7.6" fill="none"
                stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
        </svg>
        <svg class="ic ic-muted" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3.2 6.1h2.3L8.7 3.3v9.4L5.5 9.9H3.2z" fill="currentColor" />
          <path d="M11 6.2l3.4 3.6M14.4 6.2L11 9.8" fill="none"
                stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
        </svg>
        <span class="sr-only">Toggle sound</span>
      </button>
      <button id="historyToggle" class="icon-btn" type="button" aria-expanded="false" title="History">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="5.7" fill="none" stroke="currentColor" stroke-width="1.3" />
          <path d="M8 4.7V8.2l2.4 1.5" fill="none" stroke="currentColor"
                stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="sr-only">Show history</span>
      </button>
    </div>
  </header>

  <main class="stage">
    <button id="ball" class="ball" type="button" title="Shake the ball">
      <span class="ball-shade" aria-hidden="true"></span>
      <span class="ball-gloss" aria-hidden="true"></span>
      <span class="window" aria-hidden="true">
        <span class="ink"></span>
        <span class="die" id="die"><span class="die-text" id="dieText"></span></span>
      </span>
      <span class="sr-only">Shake the Magic 8 Ball</span>
    </button>
    <p class="hint" id="hint">Type a question, then shake.</p>
    <p class="sr-only" id="status" role="status" aria-live="polite"></p>
  </main>

  <form class="ask" id="askForm" autocomplete="off">
    <input
      id="question"
      type="text"
      maxlength="140"
      placeholder="Will today go my way?"
      aria-label="Your question"
    />
    <button id="shake" class="shake-btn" type="submit">Shake</button>
  </form>

  <section class="history" id="history" hidden>
    <div class="history-head">
      <h2>Recent answers</h2>
      <button id="clearHistory" class="link-btn" type="button">Clear</button>
    </div>
    <ol id="historyList" class="history-list"></ol>
    <p class="history-empty" id="historyEmpty">Nothing yet. Ask it something.</p>
  </section>

  <script src="popup.js"></script>
</body>
</html>
